<title>Hannah Job Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first job card on a pale steel ground; brand navy for structure, flame blue for actions, amber stripe marks remedial work. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --sunk: #e3e8f2;
  --fg: #0f1630;
  --muted: #586079;
  --line: #cfd6e4;
  --navy: #040d82;
  --blue: #1484ce;
  --on-blue: #ffffff;
  --remedial: #c26a00;
  --remedial-bg: #fff2df;
  --ok: #1d7a46;
  --ok-bg: #e2f4ea;
  --warn: #a1361f;
  --warn-bg: #fbe7e2;
  --plate: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1f; --surface: #141a30; --sunk: #1c2340; --fg: #e7ebf7; --muted: #9aa3bf; --line: #2c3557;
    --navy: #9fb0ff; --blue: #3fa3e6; --on-blue: #06121f; --remedial: #ffb04a; --remedial-bg: #3a2708;
    --ok: #6fd69c; --ok-bg: #12301f; --warn: #ff9a85; --warn-bg: #3d1a14; --plate: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1f; --surface: #141a30; --sunk: #1c2340; --fg: #e7ebf7; --muted: #9aa3bf; --line: #2c3557;
  --navy: #9fb0ff; --blue: #3fa3e6; --on-blue: #06121f; --remedial: #ffb04a; --remedial-bg: #3a2708;
  --ok: #6fd69c; --ok-bg: #12301f; --warn: #ff9a85; --warn-bg: #3d1a14; --plate: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3, .label, .tab, button, .pill { font-family: var(--font-display); }
h2 { font-size: 1.5rem; margin: 0; color: var(--navy); text-wrap: balance; letter-spacing: .01em; }
h3 { margin: 0; font-size: 1.15rem; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-inner { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { background: var(--plate); border-radius: 8px; padding: 4px 8px; display: flex; }
.logo img { height: 44px; width: auto; display: block; }
.app-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; }
.who { margin-left: auto; font-size: .9rem; color: var(--muted); }
nav.tabs { max-width: 980px; margin: 0 auto; padding-inline: 16px; display: flex; gap: 4px; overflow-x: auto; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1.05rem; font-weight: 600; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--blue); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

section.view { padding-top: 20px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; min-width: 0; }
.notice { background: var(--sunk); border-radius: var(--r); padding: 12px 14px; color: var(--muted); font-size: .95rem; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.label { font-size: .95rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.label .req { color: var(--warn); }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; width: 100%; min-width: 0; }
textarea { min-height: 96px; resize: vertical; }
.hint { font-size: .85rem; color: var(--muted); }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: inline-block; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; cursor: pointer; background: var(--surface); }
.seg input:checked + span { background: var(--navy); border-color: var(--navy); color: var(--surface); }
.seg input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }

.remedial-box { border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 14px; }
.remedial-box.on { border-color: var(--remedial); background: var(--remedial-bg); }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; }
.switch input { width: 22px; height: 22px; accent-color: var(--remedial); flex: none; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 1.05rem; font-weight: 600; padding: 11px 18px; border-radius: 8px; cursor: pointer; letter-spacing: .03em; }
button.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
button.danger { color: var(--warn); border-color: var(--warn); }
button.small { padding: 6px 12px; font-size: .95rem; }
button:disabled { opacity: .55; cursor: not-allowed; }
.status-msg { font-size: .95rem; color: var(--muted); }
.status-msg.ok { color: var(--ok); }
.status-msg.err { color: var(--warn); }

.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--navy); }
.stat.rem b { color: var(--remedial); }
.stat span { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-display); font-weight: 600; }

.filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
.checks { display: flex; gap: 16px; flex-wrap: wrap; }
.checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.checks input { width: 18px; height: 18px; }

.day { display: grid; gap: 8px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--navy); padding-bottom: 4px; }
.day-head h3 { color: var(--navy); text-transform: uppercase; letter-spacing: .04em; }
.day-head span { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--blue); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.entry.is-rem { border-left-color: var(--remedial); }
.entry-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.entry-time { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.entry-site { font-weight: 600; overflow-wrap: anywhere; }
.entry-desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-meta { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.rem-detail { background: var(--remedial-bg); border-radius: 6px; padding: 8px 10px; font-size: .92rem; overflow-wrap: anywhere; }
.rem-detail b { color: var(--remedial); }
.pill { display: inline-block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pill.rem { background: var(--remedial); color: var(--surface); }
.pill.done { background: var(--ok-bg); color: var(--ok); }
.pill.open { background: var(--warn-bg); color: var(--warn); }
.pill.checked { background: var(--navy); color: var(--surface); }
.entry-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty h3 { color: var(--fg); margin-bottom: 6px; }
@media (prefers-reduced-motion: no-preference) { .entry { transition: border-color .2s; } }
</style>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-log" aria-selected="true" data-view="log">Log work</button>
    <button class="tab" role="tab" id="tab-mine" aria-selected="false" data-view="mine">My jobs</button>

</header>

<main class="wrap">
  <div id="conn" class="notice" style="margin-top:16px" hidden></div>

  <!-- LOG WORK -->
  <section class="view" id="view-log">
    <form class="card" id="entry-form" novalidate>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">
        <h2 id="form-title">Log completed work</h2>
        <span class="hint">One entry per job. Fill it in when you finish, not at the end of the week.</span>
      </div>

      <div class="field" id="name-field" hidden>
        <label class="label" for="f-name">Your name <span class="req">*</span></label>
        <input id="f-name" autocomplete="name" placeholder="First and last name">
        <span class="hint">Asked once so the office knows whose entries these are.</span>
      </div>

      <div class="grid">
        <div class="field"><label class="label" for="f-date">Date <span class="req">*</span></label><input type="date" id="f-date" required></div>
        <div class="field"><label class="label" for="f-start">Started <span class="req">*</span></label><input type="time" id="f-start" required></div>
        <div class="field"><label class="label" for="f-finish">Finished <span class="req">*</span></label><input type="time" id="f-finish" required></div>
        <div class="field"><label class="label" for="f-ref">Job no. / ref</label><input id="f-ref" placeholder="e.g. HP-1042"></div>
      </div>
      <div class="grid">
        <div class="field"><label class="label" for="f-customer">Customer / client <span class="req">*</span></label><input id="f-customer" placeholder="e.g. Mrs Brown, Procast"></div>
        <div class="field"><label class="label" for="f-site">Site address</label><input id="f-site" placeholder="Street, town, postcode"></div>
      </div>

      <div class="field">
        <span class="label">Type of work <span class="req">*</span></span>
        <div class="seg" id="f-type"></div>
      </div>

      <div class="field">
        <label class="label" for="f-desc">Work completed <span class="req">*</span></label>
        <textarea id="f-desc" placeholder="What was done, e.g. Replaced diverter valve on Worcester 30i, pressure tested, boiler fired and checked, flue analysis 42ppm CO."></textarea>
      </div>

      <div class="field">
        <span class="label">Job status <span class="req">*</span></span>
        <div class="seg" id="f-status"></div>
      </div>

      <div class="remedial-box" id="rem-box">
        <label class="switch"><input type="checkbox" id="f-rem"> This was remedial work (going back to put something right)</label>
        <div id="rem-fields" class="grid" hidden>
          <div class="field"><label class="label" for="f-rem-orig">Original job no. / date</label><input id="f-rem-orig" placeholder="e.g. HP-0988, 14/09"></div>
          <div class="field"><label class="label" for="f-rem-cause">Cause <span class="req">*</span></label>
            <select id="f-rem-cause">
              <option value="">Choose…</option>
              <option>Our workmanship</option>
              <option>Faulty part / manufacturer</option>
              <option>Another trade</option>
              <option>Customer damage / misuse</option>
              <option>Snagging list</option>
              <option>Unknown</option>
            </select></div>
          <div class="field"><label class="label" for="f-rem-charge">Chargeable?</label>
            <select id="f-rem-charge"><option>Office to decide</option><option>No - our cost</option><option>Yes - charge customer</option><option>Warranty claim</option></select></div>
          <div class="field wide"><label class="label" for="f-rem-issue">What was wrong <span class="req">*</span></label><textarea id="f-rem-issue" style="min-height:70px" placeholder="e.g. Weeping compression joint under kitchen sink fitted on original job."></textarea></div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="f-notes">Notes for the office</label>
        <textarea id="f-notes" style="min-height:64px" placeholder="Materials used, parts to order, follow-up needed, customer comments…"></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit" id="save-btn">Save entry</button>
        <button class="btn" type="button" id="cancel-edit" hidden>Cancel edit</button>
        <span class="status-msg" id="form-msg" role="status"></span>
      </div>
    </form>
  </section>

  <!-- MY JOBS -->
  <section class="view" id="view-mine" hidden>
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2>My jobs</h2>
      <select id="mine-period" style="width:auto"></select>
    </div>
    <div class="stats" id="mine-stats"></div>
    <div id="mine-list" style="display:grid;gap:18px"></div>
  </section>

  <!-- ALL JOBS -->
  <section class="view" id="view-team" hidden>
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2>All jobs</h2>
      <button class="btn small" id="export-btn" hidden>Download CSV</button>
    </div>
    <div class="card filters">
      <div class="field"><label class="label" for="t-period">Period</label><select id="t-period"></select></div>
      <div class="field"><label class="label" for="t-person">Employee</label><select id="t-person"><option value="">Everyone</option></select></div>
      <div class="field"><label class="label" for="t-search">Search</label><input id="t-search" placeholder="Customer, address, job no."></div>
      <div class="checks field wide">
        <label><input type="checkbox" id="t-rem"> Remedial only</label>
        <label><input type="checkbox" id="t-open"> Return visit needed</label>
        <label><input type="checkbox" id="t-unchecked"> Not yet checked by office</label>
      </div>
    </div>
    <div class="stats" id="team-stats"></div>
    <div id="team-list" style="display:grid;gap:18px"></div>
  </section>
</main>

<script>
(() => {
  const TYPES = ["Service", "Breakdown / repair", "Installation", "Maintenance", "Inspection / survey", "Other"];
  const STATUSES = [
    { v: "complete", t: "Completed" },
    { v: "return", t: "Return visit needed" },
    { v: "parts", t: "Waiting on parts" },
  ];
  const STATUS_TEXT = Object.fromEntries(STATUSES.map(s => [s.v, s.t]));
  const DRAFT_KEY = "hannah-joblog-draft";

  const $ = id => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  };

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmtDay = s => parseYmd(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fmtShort = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const hoursOf = e => {
    if (!e.start || !e.finish) return 0;
    const [a, b] = e.start.split(":").map(Number), [c, d] = e.finish.split(":").map(Number);
    let mins = (c * 60 + d) - (a * 60 + b);
    if (mins < 0) mins += 1440;
    return mins / 60;
  };
  const fmtH = n => n.toFixed(2).replace(/\.00$/, "") + " h";

  function periods() {
    const today = new Date(); const mon = mondayOf(today);
    const mStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const lmStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    return [
      { v: "week", t: `This week (from ${fmtShort(mon)})`, from: ymd(mon), to: ymd(addDays(mon, 6)) },
      { v: "last", t: `Last week (from ${fmtShort(addDays(mon, -7))})`, from: ymd(addDays(mon, -7)), to: ymd(addDays(mon, -1)) },
      { v: "month", t: "This month", from: ymd(mStart), to: ymd(new Date(today.getFullYear(), today.getMonth() + 1, 0)) },
      { v: "lmonth", t: "Last month", from: ymd(lmStart), to: ymd(addDays(mStart, -1)) },
      { v: "all", t: "All time", from: "0000-00-00", to: "9999-99-99" },
    ];
  }
  function fillPeriods(sel) {
    const cur = sel.value || "week";
    sel.replaceChildren(...periods().map(p => h("option", { value: p.v }, p.t)));
    sel.value = cur;
  }
  const periodRange = v => periods().find(p => p.v === v) || periods()[0];

  // ---------- state ----------
  const S = {
    db: null, user: null, uid: null, isAdmin: false, canWrite: true,
    people: {},          // uid -> { name }
    entries: {},         // uid -> Map(id -> entry)
    subs: {},            // uid -> unsubscribe
    editing: null,       // { uid, id } when editing
    downloads: null,
  };

  // ---------- form ----------
  function buildSeg(container, name, items) {
    container.replaceChildren(...items.map(it => {
      const v = typeof it === "string" ? it : it.v, t = typeof it === "string" ? it : it.t;
      return h("label", {}, h("input", { type: "radio", name, value: v, id: `${name}-${v.replace(/\W+/g, "-")}` }), h("span", {}, t));
    }));
  }
  buildSeg($("f-type"), "wtype", TYPES);
  buildSeg($("f-status"), "wstatus", STATUSES);

  const radioVal = name => (document.querySelector(`input[name="${name}"]:checked`) || {}).value || "";
  const setRadio = (name, v) => document.querySelectorAll(`input[name="${name}"]`).forEach(r => { r.checked = r.value === v; });

  function setRemedialUI() {
    const on = $("f-rem").checked;
    $("rem-fields").hidden = !on;
    $("rem-box").classList.toggle("on", on);
  }
  $("f-rem").addEventListener("change", () => { setRemedialUI(); saveDraft(); });

  function readForm() {
    return {
      date: $("f-date").value, start: $("f-start").value, finish: $("f-finish").value,
      jobRef: $("f-ref").value.trim(), customer: $("f-customer").value.trim(), site: $("f-site").value.trim(),
      workType: radioVal("wtype"), description: $("f-desc").value.trim(), status: radioVal("wstatus"),
      remedial: $("f-rem").checked,
      remOriginal: $("f-rem-orig").value.trim(), remCause: $("f-rem-cause").value,
      remChargeable: $("f-rem-charge").value, remIssue: $("f-rem-issue").value.trim(),
      notes: $("f-notes").value.trim(),
    };
  }
  function writeForm(e) {
    $("f-date").value = e.date || ymd(new Date());
    $("f-start").value = e.start || ""; $("f-finish").value = e.finish || "";
    $("f-ref").value = e.jobRef || ""; $("f-customer").value = e.customer || ""; $("f-site").value = e.site || "";
    setRadio("wtype", e.workType || ""); $("f-desc").value = e.description || "";
    setRadio("wstatus", e.status || "complete");
    $("f-rem").checked = !!e.remedial; $("f-rem-orig").value = e.remOriginal || "";
    $("f-rem-cause").value = e.remCause || ""; $("f-rem-charge").value = e.remChargeable || "Office to decide";
    $("f-rem-issue").value = e.remIssue || ""; $("f-notes").value = e.notes || "";
    setRemedialUI();
  }
  function validate(e) {
    const miss = [];
    if (!$("name-field").hidden && !$("f-name").value.trim()) miss.push("your name");
    if (!e.date) miss.push("date");
    if (!e.start) miss.push("start time");
    if (!e.finish) miss.push("finish time");
    if (!e.customer) miss.push("customer");
    if (!e.workType) miss.push("type of work");
    if (!e.description) miss.push("work completed");
    if (!e.status) miss.push("job status");
    if (e.remedial && !e.remCause) miss.push("remedial cause");
    if (e.remedial && !e.remIssue) miss.push("what was wrong");
    return miss;
  }
  const msg = (text, kind = "") => { const m = $("form-msg"); m.textContent = text; m.className = "status-msg " + kind; };

  // unsent draft survives a dropped signal or closed tab (this device only)
  let draftTimer;
  function saveDraft() {
    if (S.editing) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(readForm())); } catch {} }, 400);
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch { return null; } }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
  $("entry-form").addEventListener("input", saveDraft);
  $("entry-form").addEventListener("change", saveDraft);

  function resetForm() {
    S.editing = null;
    const keepDate = $("f-date").value;
    writeForm({ date: keepDate || ymd(new Date()) });
    $("form-title").textContent = "Log completed work";
    $("save-btn").textContent = "Save entry";
    $("cancel-edit").hidden = true;
  }
  $("cancel-edit").addEventListener("click", () => { resetForm(); msg(""); });

  $("entry-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const e = readForm();
    const miss = validate(e);
    if (miss.length) { msg("Still needed: " + miss.join(", ") + ".", "err"); return; }
    if (!S.db || !S.uid) { msg("Can't save: you need to be signed in to Claude to log work. Your entry is kept on this device.", "err"); return; }
    const btn = $("save-btn"); btn.disabled = true; msg("Saving…");
    try {
      const nameInput = $("f-name").value.trim();
      if (!S.people[S.uid] || nameInput) {
        const name = nameInput || (S.people[S.uid] && S.people[S.uid].name) || "";
        await S.db.doc(`log/${S.uid}`).set({ name, joined: (S.people[S.uid] && S.people[S.uid].joined) || new Date().toISOString() });
        S.people[S.uid] = { ...(S.people[S.uid] || {}), name };
        $("name-field").hidden = true;
      }
      const now = new Date().toISOString();
      if (S.editing) {
        const { uid, id } = S.editing;
        const old = S.entries[uid] && S.entries[uid].get(id) || {};
        await S.db.doc(`log/${uid}/entries/${id}`).set({ ...stripMeta(old), ...e, updatedAt: now });
        msg("Changes saved.", "ok");
        resetForm();
      } else {
        await S.db.collection(`log/${S.uid}/entries`).add({ ...e, createdAt: now, updatedAt: now, checked: false });
        clearDraft();
        msg(`Saved: ${e.customer}, ${fmtH(hoursOf(e))}.`, "ok");
        resetForm();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      msg(err && err.code === "invalid_argument"
        ? "You don't have permission to add entries. Ask Alan to give you Contributor access."
        : err && err.code === "quota_exceeded"
        ? "The log is full. Ask the office to export and clear old entries."
        : "Couldn't save - check your signal and try again. Your entry is kept on this device.", "err");
    } finally { btn.disabled = false; }
  });
  const stripMeta = o => { const { id, uid, ...rest } = o; return rest; };

  // ---------- tabs ----------
  function show(view) {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view)));
    ["log", "mine", "team"].forEach(v => { $("view-" + v).hidden = v !== view; });
    try { localStorage.setItem("hannah-joblog-tab", view); } catch {}
    render();
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.view)));

  // ---------- rendering ----------
  const allEntries = () => Object.entries(S.entries).flatMap(([uid, m]) => [...m.entries()].map(([id, e]) => ({ ...e, id, uid })));
  const personName = uid => (S.people[uid] && S.people[uid].name) || "Unnamed";

  function stats(list, el) {
    const hrs = list.reduce((a, e) => a + hoursOf(e), 0);
    const rem = list.filter(e => e.remedial).length;
    const open = list.filter(e => e.status && e.status !== "complete").length;
    const pct = list.length ? Math.round(rem / list.length * 100) : 0;
    el.replaceChildren(
      h("div", { class: "stat" }, h("b", {}, list.length), h("span", {}, "Jobs logged")),
      h("div", { class: "stat" }, h("b", {}, hrs.toFixed(1)), h("span", {}, "Hours on jobs")),
      h("div", { class: "stat rem" }, h("b", {}, rem), h("span", {}, `Remedial (${pct}%)`)),
      h("div", { class: "stat" }, h("b", {}, open), h("span", {}, "Return / parts")),
    );
  }

  function entryCard(e, { showWho, mine }) {
    const hrs = hoursOf(e);
    const statusCls = e.status === "complete" ? "done" : "open";
    const card = h("article", { class: "entry" + (e.remedial ? " is-rem" : "") },
      h("div", { class: "entry-top" },
        h("span", { class: "entry-time" }, `${e.start || "?"}–${e.finish || "?"}`),
        h("span", { class: "pill" }, fmtH(hrs)),
        e.remedial && h("span", { class: "pill rem" }, "Remedial"),
        h("span", { class: "pill " + statusCls }, STATUS_TEXT[e.status] || "No status"),
        e.checked && h("span", { class: "pill checked" }, "Checked"),
      ),
      h("div", { class: "entry-site" }, [e.customer, e.site].filter(Boolean).join(" · ")),
      h("div", { class: "entry-desc" }, e.description || ""),
      e.remedial && h("div", { class: "rem-detail" },
        h("b", {}, "Remedial: "), e.remCause || "cause not given",
        e.remOriginal ? ` · original job ${e.remOriginal}` : "",
        e.remChargeable ? ` · ${e.remChargeable}` : "",
        e.remIssue ? h("div", {}, e.remIssue) : null),
      e.notes && h("div", { class: "entry-meta" }, h("span", {}, "Notes: " + e.notes)),
      h("div", { class: "entry-meta" },
        showWho && h("span", {}, h("strong", {}, personName(e.uid))),
        h("span", {}, e.workType || ""),
        e.jobRef && h("span", {}, "Job " + e.jobRef),
        e.createdAt && h("span", {}, "Logged " + new Date(e.createdAt).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))),
    );
    const acts = h("div", { class: "entry-actions" });
    if (mine || S.isAdmin) {
      acts.append(h("button", { class: "btn small", type: "button", onclick: () => startEdit(e) }, "Edit"));
      const del = h("button", { class: "btn small danger", type: "button" }, "Delete");
      del.addEventListener("click", async () => {
        if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; setTimeout(() => { del.dataset.armed = ""; del.textContent = "Delete"; }, 4000); return; }
        del.disabled = true;
        try { await S.db.doc(`log/${e.uid}/entries/${e.id}`).delete(); } catch { del.disabled = false; del.textContent = "Couldn't delete"; }
      });
      acts.append(del);
    }
    if (S.isAdmin) {
      const chk = h("button", { class: "btn small", type: "button" }, e.checked ? "Mark unchecked" : "Mark checked");
      chk.addEventListener("click", async () => {
        chk.disabled = true;
        try { await S.db.doc(`log/${e.uid}/entries/${e.id}`).update({ checked: !e.checked, checkedAt: new Date().toISOString() }); }
        catch { chk.disabled = false; chk.textContent = "Couldn't update"; }
      });
      acts.append(chk);
    }
    if (acts.childNodes.length) card.append(acts);
    return card;
  }

  function startEdit(e) {
    S.editing = { uid: e.uid, id: e.id };
    writeForm(e);
    $("form-title").textContent = e.uid === S.uid ? "Edit entry" : `Edit ${personName(e.uid)}'s entry`;
    $("save-btn").textContent = "Save changes";
    $("cancel-edit").hidden = false;
    msg("");
    show("log");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function groupedList(list, el, opts, emptyEl) {
    if (!list.length) { el.replaceChildren(emptyEl); return; }
    const byDate = new Map();
    list.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (a.start || "").localeCompare(b.start || ""))
      .forEach(e => { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); });
    el.replaceChildren(...[...byDate].map(([date, items]) => h("div", { class: "day" },
      h("div", { class: "day-head" }, h("h3", {}, date ? fmtDay(date) : "No date"),
        h("span", {}, `${items.length} job${items.length > 1 ? "s" : ""} · ${fmtH(items.reduce((a, e) => a + hoursOf(e), 0))}`)),
      ...items.map(e => entryCard(e, opts)))));
  }

  function inRange(e, r) { return (e.date || "") >= r.from && (e.date || "") <= r.to; }

  function renderMine() {
    const r = periodRange($("mine-period").value);
    const list = allEntries().filter(e => e.uid === S.uid && inRange(e, r));
    stats(list, $("mine-stats"));
    groupedList(list, $("mine-list"), { showWho: false, mine: true },
      h("div", { class: "card empty" }, h("h3", {}, "Nothing logged for this period"),
        h("p", {}, "Jobs you save on the Log work tab show up here, grouped by day.")));
  }

  function teamFiltered() {
    const r = periodRange($("t-period").value);
    const who = $("t-person").value, q = $("t-search").value.trim().toLowerCase();
    return allEntries().filter(e => inRange(e, r)
      && (!who || e.uid === who)
      && (!$("t-rem").checked || e.remedial)
      && (!$("t-open").checked || (e.status && e.status !== "complete"))
      && (!$("t-unchecked").checked || !e.checked)
      && (!q || [e.customer, e.site, e.jobRef, e.description, e.remOriginal].join(" ").toLowerCase().includes(q)));
  }
  function renderTeam() {
    const sel = $("t-person"), cur = sel.value;
    const uids = Object.keys(S.people).sort((a, b) => personName(a).localeCompare(personName(b)));
    sel.replaceChildren(h("option", { value: "" }, "Everyone"), ...uids.map(u => h("option", { value: u }, personName(u))));
    sel.value = uids.includes(cur) ? cur : "";
    const list = teamFiltered();
    stats(list, $("team-stats"));
    groupedList(list, $("team-list"), { showWho: true, mine: false },
      h("div", { class: "card empty" }, h("h3", {}, uids.length ? "No jobs match these filters" : "No jobs logged yet"),
        h("p", {}, uids.length ? "Try a wider period or clear the tick boxes." : "When your team logs work from their phones, every entry appears here with who did it, when, and whether it was remedial.")));
    $("export-btn").hidden = !S.downloads;
  }

  function render() {
    if (!$("view-mine").hidden) renderMine();
    if (!$("view-team").hidden) renderTeam();
  }
  ["t-period", "t-person", "t-rem", "t-open", "t-unchecked", "mine-period"].forEach(id => $(id).addEventListener("change", render));
  $("t-search").addEventListener("input", render);

  // ---------- CSV ----------
  $("export-btn").addEventListener("click", async () => {
    const rows = teamFiltered().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.start || "").localeCompare(b.start || ""));
    const cols = [["Date", e => e.date], ["Employee", e => personName(e.uid)], ["Start", e => e.start], ["Finish", e => e.finish],
      ["Hours", e => hoursOf(e).toFixed(2)], ["Job ref", e => e.jobRef], ["Customer", e => e.customer], ["Site", e => e.site],
      ["Type", e => e.workType], ["Work completed", e => e.description], ["Status", e => STATUS_TEXT[e.status] || ""],
      ["Remedial", e => e.remedial ? "Yes" : "No"], ["Remedial cause", e => e.remCause], ["Original job", e => e.remOriginal],
      ["Chargeable", e => e.remedial ? e.remChargeable : ""], ["What was wrong", e => e.remIssue], ["Notes", e => e.notes],
      ["Checked", e => e.checked ? "Yes" : "No"], ["Logged at", e => e.createdAt]];
    const esc = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = [cols.map(c => c[0]).join(","), ...rows.map(e => cols.map(c => esc(c[1](e))).join(","))].join("\r\n");
    const r = periodRange($("t-period").value);
    try { await S.downloads.save({ filename: `hannah-job-log-${r.v === "all" ? "all" : r.from}.csv`, data: "﻿" + csv }); } catch {}
  });

  // ---------- data ----------
  function watchPerson(uid) {
    if (S.subs[uid]) return;
    S.entries[uid] = new Map();
    S.subs[uid] = S.db.collection(`log/${uid}/entries`).onSnapshot(snap => {
      S.entries[uid] = new Map(snap.docs.map(d => [d.id, d.data()]));
      render();
    }, () => {});
  }

  async function boot() {
    fillPeriods($("mine-period")); fillPeriods($("t-period"));
    const draft = loadDraft();
    writeForm(draft || { date: ymd(new Date()) });
    try { const t = localStorage.getItem("hannah-joblog-tab"); if (t && t !== "log") show(t); } catch {}

    const [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    S.db = db; S.user = user; S.downloads = downloads;
    if (!db || !user) {
      const c = $("conn"); c.hidden = false; c.classList.add("warn");
      c.textContent = "Sign in to Claude to log and view jobs. Anything you type here is kept on this device until you can save.";
      return;
    }
    const me = await user.me();
    S.uid = me.id; S.isAdmin = me.canEdit || me.isOwner;
    if (!S.uid) {
      const c = $("conn"); c.hidden = false; c.classList.add("warn");
      c.textContent = "Your account can't save entries on this page. Ask Alan to share it with you as a Contributor.";
      return;
    }
    $("who").textContent = S.isAdmin ? "Office view: you can edit and check anyone's entries" : "";
    $("export-btn").hidden = !downloads;

    db.collection("log").onSnapshot(snap => {
      S.people = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
      Object.keys(S.people).forEach(watchPerson);
      if (!S.people[S.uid]) watchPerson(S.uid);
      const needName = !S.people[S.uid] || !S.people[S.uid].name;
      $("name-field").hidden = !needName;
      if (needName && !$("f-name").value && me.name) $("f-name").value = me.name;
      $("who").textContent = (S.people[S.uid] && S.people[S.uid].name ? "Signed in as " + S.people[S.uid].name : "")
        + (S.isAdmin ? (S.people[S.uid] && S.people[S.uid].name ? " · " : "") + "Office view" : "");
      render();
    }, () => {});
  }
  boot();
})();
</script>
